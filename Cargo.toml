[workspace]
resolver = "3"
members = [
    "feiri-cli",
    "feiri-core",
    "feiri-daemon",
    "feiri-ipc",
    "feiri-ui"
]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["io-util"] }
niri-ipc = "=26.4.0"
serde_json = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
slint = {
  version = "1.18.1",
  default-features = false,
  features = [
    "std",
    "backend-winit-wayland",
    "renderer-software",
    "compat-1-18"
  ],
}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
dotenvy = "0.15"
async-trait = "0.1.92"
thiserror = "2.0.20"

[workspace.package]
edition = "2024"
rust-version = "1.95"
